services:
  - type: web
    name: tsatracker-com
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    disk:
      name: tsa-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENABLE_POLLER
        value: "true"
      - key: POLL_SECONDS
        value: "120"
      - key: ENABLE_ANALYTICS
        value: "true"
      - key: GA_MEASUREMENT_ID
        value: G-9MN7W14PC1
      - key: AIRPORT_ARRIVAL_MODE_CODES
        value: "ATL,BOS,CLT,DCA,DFW,EWR,JAX,JFK,LAS,LAX,LGA,MCO,MIA,ORD,PHL,SEA,SFO"
      - key: SUPABASE_SAMPLE_MINUTES
        value: "10"
      - key: DB_PATH
        value: /data/data.db
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: COLLECT_NOW_TOKEN
        generateValue: true
